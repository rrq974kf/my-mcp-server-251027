<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- 배경 (우주) -->
  <rect width="400" height="500" fill="#0a0e27"/>
  
  <!-- 별들 -->
  <circle cx="50" cy="50" r="1.5" fill="white"/>
  <circle cx="100" cy="80" r="1" fill="white"/>
  <circle cx="350" cy="40" r="1.2" fill="white"/>
  <circle cx="320" cy="120" r="1" fill="white"/>
  <circle cx="80" cy="150" r="1.3" fill="white"/>
  <circle cx="370" cy="200" r="1" fill="white"/>
  <circle cx="30" cy="250" r="1.5" fill="white"/>
  <circle cx="150" cy="300" r="1" fill="white"/>
  <circle cx="90" cy="400" r="1.2" fill="white"/>
  <circle cx="330" cy="450" r="1" fill="white"/>
  
  <!-- 우주선 본체 -->
  <g transform="translate(200, 250)">
    <!-- 메인 몸체 -->
    <ellipse cx="0" cy="0" rx="45" ry="70" fill="#c0c5ce"/>
    <ellipse cx="0" cy="0" rx="35" ry="65" fill="#e8edf2"/>
    
    <!-- 창문 -->
    <ellipse cx="0" cy="-20" rx="25" ry="20" fill="#4a90e2" opacity="0.7"/>
    <ellipse cx="0" cy="-20" rx="20" ry="16" fill="#5ca3ff" opacity="0.5"/>
    <ellipse cx="-8" cy="-25" rx="8" ry="8" fill="#a8d5ff" opacity="0.6"/>
    
    <!-- 날개 왼쪽 -->
    <path d="M -35 20 L -80 60 L -80 80 L -35 50 Z" fill="#ff6b6b"/>
    <path d="M -35 25 L -75 60 L -75 75 L -35 48 Z" fill="#ff8787"/>
    
    <!-- 날개 오른쪽 -->
    <path d="M 35 20 L 80 60 L 80 80 L 35 50 Z" fill="#ff6b6b"/>
    <path d="M 35 25 L 75 60 L 75 75 L 35 48 Z" fill="#ff8787"/>
    
    <!-- 우주선 코 -->
    <path d="M -25 -70 L 0 -100 L 25 -70 Z" fill="#e74c3c"/>
    <path d="M -20 -70 L 0 -95 L 20 -70 Z" fill="#ff6b6b"/>
    
    <!-- 엔진 불꽃 -->
    <ellipse cx="-15" cy="70" rx="8" ry="15" fill="#ffd700" opacity="0.8"/>
    <ellipse cx="-15" cy="75" rx="6" ry="20" fill="#ff6b00" opacity="0.7"/>
    <ellipse cx="-15" cy="80" rx="4" ry="25" fill="#ff0000" opacity="0.6"/>
    
    <ellipse cx="15" cy="70" rx="8" ry="15" fill="#ffd700" opacity="0.8"/>
    <ellipse cx="15" cy="75" rx="6" ry="20" fill="#ff6b00" opacity="0.7"/>
    <ellipse cx="15" cy="80" rx="4" ry="25" fill="#ff0000" opacity="0.6"/>
    
    <!-- 디테일 라인 -->
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#95a5a6" stroke-width="2"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#95a5a6" stroke-width="2"/>
    <line x1="-25" y1="30" x2="25" y2="30" stroke="#95a5a6" stroke-width="1.5"/>
    
    <!-- 안테나 -->
    <line x1="-20" y1="-70" x2="-20" y2="-80" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="-20" cy="-82" r="3" fill="#ffd700"/>
    
    <line x1="20" y1="-70" x2="20" y2="-80" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="20" cy="-82" r="3" fill="#ffd700"/>
  </g>
  
  <!-- 별똥별/반짝임 효과 -->
  <path d="M 280 100 L 300 105 L 280 110 L 285 130" stroke="#ffd700" stroke-width="1" fill="none" opacity="0.7"/>
</svg>
